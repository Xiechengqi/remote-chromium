[program:gemini-cli]
command=bash /app/supervisor/start.d/09-gemini-cli.sh
user=root
autostart=true
startretries=3
autorestart=true
exitcodes=0
startsecs=0
priority=9
stdout_logfile=/app/logs/gemini-cli.stdout.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=10
stderr_logfile=/app/logs/gemini-cli.stderr.log
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=10
