[program:opencode-react-grab-server]
command=bash /app/supervisor/start.d/20-opencode-react-grab-server.sh
user=root
autostart=true
startretries=3
autorestart=true
exitcodes=0
startsecs=0
priority=20
stdout_logfile=/app/logs/opencode-react-grab-server.stdout.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=10
stderr_logfile=/app/logs/opencode-react-grab-server.stderr.log
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=10
