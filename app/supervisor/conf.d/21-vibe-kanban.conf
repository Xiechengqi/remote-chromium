[program:vibe-kanban]
command=bash /app/supervisor/start.d/21-vibe-kanban.sh
user=root
autostart=true
startretries=3
autorestart=true
exitcodes=0
startsecs=0
priority=21
stdout_logfile=/app/logs/vibe-kanban.stdout.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=10
stderr_logfile=/app/logs/vibe-kanban.stderr.log
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=10
