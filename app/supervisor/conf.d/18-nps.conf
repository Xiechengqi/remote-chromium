[program:nps]
command=bash /app/supervisor/start.d/18-nps.sh
user=root
autostart=true
startretries=3
autorestart=true
exitcodes=0
startsecs=0
priority=8
stdout_logfile=/app/logs/nps.stdout.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=10
stderr_logfile=/app/logs/nps.stderr.log
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=10
