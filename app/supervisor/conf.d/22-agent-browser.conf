[program:agent-browser]
command=bash /app/supervisor/start.d/22-agent-browser.sh
user=root
autostart=true
startretries=3
autorestart=true
exitcodes=0
startsecs=0
priority=22
stdout_logfile=/app/logs/agent-browser.stdout.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=10
stderr_logfile=/app/logs/agent-browser.stderr.log
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=10
