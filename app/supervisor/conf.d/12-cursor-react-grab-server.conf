[program:cursor-react-grab-server]
command=bash /app/supervisor/start.d/12-cursor-react-grab-server.sh
user=root
autostart=true
startretries=3
autorestart=true
exitcodes=0
startsecs=0
priority=12
stdout_logfile=/app/logs/cursor-react-grab-server.stdout.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=10
stderr_logfile=/app/logs/cursor-react-grab-server.stderr.log
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=10
