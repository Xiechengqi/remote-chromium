[program:ide-xvfb]
command=bash /app/supervisor/start.d/01-ide-xvfb.sh
user=root
autostart=true
startretries=3
autorestart=true
priority=1
stdout_logfile=/app/logs/ide-xvfb.stdout.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=10
stderr_logfile=/app/logs/ide-xvfb.stderr.log
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=10
